name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dental
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dental
      DENTAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dental?schema=vitest
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx keystone build --no-ui
      - run: npx prisma migrate deploy
      - name: Apply migrations to the test schema
        run: DATABASE_URL="$DENTAL_TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests (includes no-licensed-content)
        run: npm test
      - run: npm run test:node
